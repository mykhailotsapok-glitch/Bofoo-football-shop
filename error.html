<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 - You're lost</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="CSS/error.css">
</head>
<body>
  <div class="error-wrapper">
    <div class="illustration">
      <div class="planet"></div>

      <span class="dot" style="top: 20px; left: 140px;"></span>
      <span class="dot lime" style="top: 70px; left: 210px;"></span>
      <span class="dot" style="top: 120px; left: 60px;"></span>
      <span class="dot lime" style="top: 180px; left: 190px;"></span>

      <div class="player">
        <div class="player__head"></div>
        <div class="player__torso"></div>
        <div class="player__arm player__arm--left"></div>
        <div class="player__arm player__arm--right"></div>
        <div class="player__leg player__leg--support"></div>
        <div class="player__leg player__leg--kick"></div>
      </div>

      <div class="ball"></div>
    </div>

    <div class="content">
      <h1>404</h1>
      <h2>UH OH! You're lost.</h2>
      <p>
        The page you are looking for does not exist. How you got here is a mystery.
        But you can click the button below to go back to the homepage.
      </p>
      <button href="index.html" class="btn-home" id="homeBtn">Home</button>
    </div>
  </div>

  <script src="JS/error.js"></script>
</body>
</html>
